syntax = "proto3";

option go_package = "github.com/Sneha41sb/digital-twin/proto";

package motor;


message SensorData {
  float rpm = 1;
  float temperature = 2;
  float vibration = 3;
  uint64 timestamp = 4;
}


message Prediction {
  float time_to_failure = 1;
  string health_status = 2;
  float expected_temp = 3; 
}

service TwinService {
  rpc StreamTelemetry(stream SensorData) returns (stream Prediction);
}